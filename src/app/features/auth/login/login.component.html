<section class="mx-auto grid max-w-6xl gap-6 lg:grid-cols-[1.05fr_0.95fr]">
  <div class="flex flex-col justify-between rounded-[2rem] border border-slate-200 bg-white p-8 shadow-2xl shadow-slate-200/50 backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/65 dark:shadow-cyan-950/20">
    <div>
      <p class="text-xs uppercase tracking-[0.4em] text-cyan-600/80 dark:text-cyan-300/80">Acceso seguro</p>
      <h2 class="mt-4 max-w-xl text-4xl font-semibold text-slate-900 md:text-5xl dark:text-white">Entrar al control de asistencia Tajamar</h2>
      <p class="mt-4 max-w-2xl text-base leading-7 text-slate-600 dark:text-slate-300">Una interfaz pensada para alumno, profesor y administracion, conectada con la API de faltas de Tajamar.</p>
    </div>
  </div>

  <div class="rounded-[2rem] border border-slate-200 bg-white p-8 shadow-2xl shadow-slate-200/50 backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/80 dark:shadow-indigo-950/20">
    <p class="text-sm uppercase tracking-[0.3em] text-cyan-600/80 dark:text-cyan-300/80">Login</p>
    <h3 class="mt-3 text-2xl font-semibold text-slate-900 dark:text-white">Accede con tu email</h3>

    <form class="mt-8 grid gap-5" (ngSubmit)="submit()">
      <label class="grid gap-2 text-sm text-slate-700 dark:text-slate-200">
        Email
        <input class="rounded-2xl border border-slate-300 bg-slate-100 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-cyan-500/60 focus:ring-2 focus:ring-cyan-500/20 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-cyan-300/60 dark:focus:ring-cyan-300/20" type="email" name="email" [(ngModel)]="email" autocomplete="email" placeholder="usuario@tajamar365.com" required />
      </label>

      <label class="grid gap-2 text-sm text-slate-700 dark:text-slate-200">
        Contrasena
        <input class="rounded-2xl border border-slate-300 bg-slate-100 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-cyan-500/60 focus:ring-2 focus:ring-cyan-500/20 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-cyan-300/60 dark:focus:ring-cyan-300/20" type="password" name="password" [(ngModel)]="password" autocomplete="current-password" placeholder="••••••••" required />
      </label>

      <p *ngIf="errorMessage" class="rounded-2xl border border-rose-300 bg-rose-50 px-4 py-3 text-sm text-rose-800 dark:border-rose-400/20 dark:bg-rose-400/10 dark:text-rose-100">{{ errorMessage }}</p>

      <button type="submit" class="inline-flex items-center justify-center rounded-2xl bg-gradient-to-r from-cyan-300 to-emerald-300 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:scale-[1.01] hover:from-cyan-200 hover:to-emerald-200">Entrar</button>
    </form>
  </div>
</section>
