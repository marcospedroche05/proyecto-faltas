<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute left-[-8rem] top-[-8rem] h-72 w-72 rounded-full bg-cyan-400/10 blur-3xl"></div>
    <div class="absolute right-[-6rem] top-20 h-72 w-72 rounded-full bg-indigo-400/10 blur-3xl"></div>
    <div class="absolute bottom-[-10rem] left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-emerald-400/10 blur-3xl"></div>
  </div>

  <header class="relative z-10 border-b border-slate-200 bg-white/95 backdrop-blur-xl dark:border-white/10 dark:bg-slate-950/75">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-6 py-5 lg:flex-row lg:items-center lg:justify-between">
      <div>
        <p class="text-sm font-medium tracking-wider text-cyan-600/80 dark:text-cyan-300/80">Tajamar</p>
        <h1 class="mt-2 text-2xl font-semibold text-slate-900 dark:text-white">Control de Asistencia</h1>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Alumno, profesor y administración sobre una misma base visual.</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <a *ngIf="!isAuthenticated()" routerLink="/login" routerLinkActive #loginActive="routerLinkActive"
           [ngClass]="loginActive.isActive
             ? 'border-cyan-400 bg-cyan-400 text-slate-950'
             : 'border-slate-300 text-slate-700 hover:bg-slate-200 hover:text-slate-900 dark:border-white/15 dark:text-slate-200 dark:hover:bg-white/10 dark:hover:text-white'"
           class="rounded-full border px-4 py-2 text-sm font-medium transition">Login</a>

        <a *ngIf="isAuthenticated()" [routerLink]="dashboardPath()" routerLinkActive #dashboardActive="routerLinkActive"
           [ngClass]="dashboardActive.isActive
             ? 'border-cyan-400 bg-cyan-400 text-slate-950'
             : 'border-cyan-500/40 text-cyan-700 hover:bg-cyan-50 hover:text-cyan-900 dark:border-cyan-300/30 dark:text-cyan-200 dark:hover:bg-white/10 dark:hover:text-cyan-100'"
           class="rounded-full border px-4 py-2 text-sm font-medium transition">{{ currentRoleLabel() }}</a>

        <a *ngIf="isAuthenticated()" routerLink="/profile" routerLinkActive #profileActive="routerLinkActive"
           [attr.aria-label]="'Ver perfil de ' + currentUserName()" title="Perfil"
           [ngClass]="profileActive.isActive
             ? 'border-cyan-400 ring-2 ring-cyan-300/70'
             : 'border-slate-300 hover:border-cyan-400 hover:ring-2 hover:ring-cyan-300/40 dark:border-white/15 dark:hover:border-cyan-300'"
           class="flex h-11 w-11 flex-shrink-0 items-center justify-center overflow-hidden rounded-full border-2 bg-slate-100 text-sm font-semibold text-slate-700 shadow-sm transition dark:bg-white/10 dark:text-slate-100">
          <img *ngIf="avatarImagen() && !avatarImagenFailed()" [src]="avatarImagen()!" [alt]="currentUserName()" class="h-full w-full object-cover" (error)="onAvatarImageError()">
          <span *ngIf="!avatarImagen() || avatarImagenFailed()">{{ avatarInitials() }}</span>
        </a>

        <button type="button" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'" class="rounded-full border border-slate-300 dark:border-white/15 px-3 py-2 text-base leading-none text-slate-700 dark:text-slate-200 transition hover:bg-slate-200 hover:text-slate-900 dark:hover:bg-white/10 dark:hover:text-white">
          {{ isDark() ? '☀' : '🌙' }}
        </button>
        <button *ngIf="isAuthenticated()" type="button" class="rounded-full border border-rose-500 bg-rose-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-rose-600 hover:border-rose-600 dark:border-rose-400 dark:bg-rose-500 dark:hover:bg-rose-400" (click)="logout()">Salir</button>
      </div>
    </div>
  </header>

  <main class="relative z-10 mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <router-outlet></router-outlet>
  </main>

  <app-toast-container></app-toast-container>
  <app-confirm-dialog></app-confirm-dialog>
</div>
